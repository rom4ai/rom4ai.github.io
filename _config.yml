title: ROM4AI
description: Research ideas for next-generation AI hardware systems and accelerators.
markdown: kramdown
future: true
post_metrics_endpoint: "https://rom4ai-blog-metrics.shiruizhao-pro.workers.dev"
plugins:
  - jekyll-feed

author:
  name: ROM4AI

header_pages:
  - index.html

# Ensure all assets are included in the build
include:
  - assets

# Exclude only specific directories that shouldn't be in the build
exclude:
  - _site/
  - vendor/
  - .bundle/
  - .claude/
  - metrics-api/
  - Gemfile
  - Gemfile.lock
